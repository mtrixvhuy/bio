<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nguyen Minh Tri🧸 - Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://i.ibb.co/JFmF797k/avatar-modificado-1791197595582.gif') center/cover no-repeat fixed;
            background-size: cover;
            padding: 20px;
            overflow: hidden;
            position: relative;
            touch-action: pan-y;
        }

        /* Lớp phủ mờ */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 15, 0.4);
            backdrop-filter: blur(4px);
            z-index: 0;
        }

        /* ===== WELCOME OVERLAY ===== */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 5, 15, 0.88);
            backdrop-filter: blur(12px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .welcome-overlay.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .welcome-wrapper {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .welcome-char {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(#ffffff, #000000, #ffffff, #000000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.4);
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: translateX(-60px) scale(0.5);
            animation: slideFromCenter 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            filter: blur(4px);
            display: inline-block;
        }
        .welcome-char:nth-child(1) { animation-delay: 0.05s; }
        .welcome-char:nth-child(2) { animation-delay: 0.10s; }
        .welcome-char:nth-child(3) { animation-delay: 0.15s; }
        .welcome-char:nth-child(4) { animation-delay: 0.20s; }
        .welcome-char:nth-child(5) { animation-delay: 0.25s; }
        .welcome-char:nth-child(6) { animation-delay: 0.30s; }
        .welcome-char:nth-child(7) { animation-delay: 0.35s; }

        @keyframes slideFromCenter {
            0% { opacity: 0; transform: translateX(-60px) scale(0.5); filter: blur(4px); }
            40% { opacity: 0.7; transform: translateX(10px) scale(1.05); filter: blur(1px); }
            70% { transform: translateX(-4px) scale(0.98); }
            100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }

        /* ===== SAKURA NỀN ===== */
        .sakura-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sakura-bg .sakura {
            position: absolute;
            top: -30px;
            color: #000000;
            font-size: 22px;
            opacity: 0.4;
            animation: sakuraFall linear infinite;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        @keyframes sakuraFall {
            0% { transform: translateY(-30px) rotate(0deg) scale(0.7); opacity: 0.4; }
            30% { opacity: 0.7; }
            70% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0.03; }
        }

        /* ===== GIỌT NƯỚC NỀN ===== */
        .drop-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 4px;
            height: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(0.8px);
            animation: dropFall linear infinite;
        }
        @keyframes dropFall {
            0% { transform: translateY(-30px) scale(0.5); opacity: 0.05; }
            10% { opacity: 0.15; }
            70% { opacity: 0.1; }
            100% { transform: translateY(110vh) scale(1.1); opacity: 0.01; }
        }

        /* ===== GIỌT NƯỚC BÁM TRÊN MENU ===== */
        .card-drops {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            border-radius: 32px;
            overflow: hidden;
        }

        .card-drop {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(0.3px);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.01), inset 0 -2px 4px rgba(255, 255, 255, 0.02);
            animation: dropStay 4s ease-in-out infinite;
            transform-origin: center;
            border: 0.3px solid rgba(255, 255, 255, 0.02);
            will-change: transform, opacity;
        }

        .card-drop::after {
            content: '';
            position: absolute;
            top: 6%;
            left: 15%;
            width: 25%;
            height: 18%;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            filter: blur(0.8px);
        }

        .card-drop::before {
            content: '';
            position: absolute;
            bottom: 8%;
            right: 8%;
            width: 10%;
            height: 8%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            filter: blur(0.5px);
        }

        @keyframes dropStay {
            0% { transform: translateY(0px) scale(0.8) rotate(0deg); opacity: 0.1; }
            30% { opacity: 0.4; transform: translateY(0px) scale(1) rotate(1deg); }
            60% { opacity: 0.5; transform: translateY(2px) scale(1.02) rotate(-0.5deg); }
            85% { opacity: 0.3; transform: translateY(0px) scale(0.9) rotate(1deg); }
            100% { opacity: 0.1; transform: translateY(0px) scale(0.8) rotate(0deg); }
        }

        /* ===== HIỆU ỨNG CLICK ===== */
        .click-effect-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }
        .click-sakura {
            position: absolute;
            font-size: 26px;
            opacity: 0;
            animation: clickSakuraFall 2.5s cubic-bezier(0.22, 0.85, 0.36, 1) forwards;
            pointer-events: none;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }
        @keyframes clickSakuraFall {
            0% { opacity: 0; transform: translateY(-20px) scale(0.4) rotate(0deg); }
            15% { opacity: 1; transform: translateY(15px) scale(1.2) rotate(25deg); }
            50% { opacity: 1; transform: translateY(70px) scale(1) rotate(180deg); }
            85% { opacity: 0.8; transform: translateY(140px) scale(0.9) rotate(340deg); }
            100% { opacity: 0; transform: translateY(220px) scale(0.5) rotate(420deg); }
        }

        /* ===== CARD ===== */
        .card {
            position: relative;
            z-index: 2;
            max-width: 380px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: linear-gradient(135deg, #000000, #000000, #ffffff, #ffffff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 3.5s ease-in-out infinite;
            opacity: 0.5;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; opacity: 0.3; }
            50% { background-position: 100% 50%; opacity: 0.8; }
            100% { background-position: 0% 50%; opacity: 0.3; }
        }

        /* ===== DÒNG CHÀO ===== */
        .greeting {
            text-align: center;
            padding: 6px 10px;
            margin-bottom: 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }
        .greeting .text {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
            white-space: nowrap;
            animation: marquee 10s linear infinite;
            width: max-content;
            padding-left: 100%;
        }
        .greeting .text .highlight {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ===== CÁC CỘT BAY BỔNG ===== */
        .col-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 4px;
            animation: floatTop 3.5s ease-in-out infinite;
            transition: transform 0.3s ease;
        }
        .col-top:hover {
            transform: scale(1.02) translateY(-2px);
        }
        @keyframes floatTop {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(0.5deg); }
            75% { transform: translateY(-3px) rotate(-0.3deg); }
        }

        .col-music {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 10px;
            cursor: pointer;
            animation: floatMusic 4s ease-in-out infinite;
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .col-music:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.02) translateY(-3px);
        }
        @keyframes floatMusic {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-5px) rotate(0.3deg); }
            66% { transform: translateY(-2px) rotate(-0.2deg); }
        }

        .col-progress {
            width: 100%;
            height: 3px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.06);
            position: relative;
            cursor: pointer;
            margin-bottom: 10px;
            animation: floatProgress 5s ease-in-out infinite;
        }
        @keyframes floatProgress {
            0%, 100% { transform: scaleX(1) translateY(0); }
            50% { transform: scaleX(1.03) translateY(-2px); }
        }

        .col-social {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
            animation: floatSocial 4.2s ease-in-out infinite;
        }
        @keyframes floatSocial {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-4px) rotate(0.2deg); }
            70% { transform: translateY(-2px) rotate(-0.1deg); }
        }

        .col-footer {
            text-align: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            animation: floatFooter 4.8s ease-in-out infinite;
        }
        @keyframes floatFooter {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* ===== TOP ===== */
        .top-section .left .username {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .top-section .left .status {
            font-size: 12px;
            color: #000000;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-section .left .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000000;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ===== AVATAR - ẢNH MỚI ===== */
        .top-section .right .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .top-section .right .avatar:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.15);
        }
        .top-section .right .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== MUSIC ===== */
        .music-section .icon {
            font-size: 18px;
            color: #ffffff;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .music-section .info {
            flex: 1;
            overflow: hidden;
        }
        .music-section .info .song {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-section .info .artist {
            font-size: 12px;
            color: #000000;
        }
        .music-section .time {
            font-size: 12px;
            color: #ffffff;
            flex-shrink: 0;
        }
        .music-section .controls {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .music-section .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            color: #000000;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .music-section .controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .music-section .controls button:active {
            transform: scale(0.9);
        }

        /* ===== PROGRESS ===== */
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #ffffff, #ffffff);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: width 0.1s linear;
        }

        /* ===== SOCIAL - 2 CỘT ===== */
        .social-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 6px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        .social-item::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            padding: 2px;
            background: linear-gradient(135deg, #ffffff, #ffffff, #ffffff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlowSocial 3s ease-in-out infinite;
            opacity: 0.2;
        }
        .social-item:hover::before { opacity: 0.7; }
        .social-item:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(255, 255, 255, 0.04);
        }
        @keyframes borderGlowSocial {
            0% { background-position: 0% 50%; opacity: 0.2; }
            50% { background-position: 100% 50%; opacity: 0.7; }
            100% { background-position: 0% 50%; opacity: 0.2; }
        }
        .social-item .icon svg {
            width: 18px;
            height: 18px;
            fill: #000000;
            transition: fill 0.3s ease, transform 0.3s ease;
        }
        .social-item:hover .icon svg {
            fill: #000000;
            transform: scale(1.1);
        }
        .social-item .text {
            font-size: 11px;
        }

        /* ===== FOOTER ===== */
        .footer p {
            font-size: 11px;
            color: #000000;
            transition: color 0.3s ease;
        }
        .footer p:hover {
            color: #ffffff;
        }
        .footer span {
            color: #000000;
            transition: color 0.3s ease;
        }
        .footer span:hover {
            color: #ffffff;
        }

        /* ===== AUDIO ẨN ===== */
        .video-wrapper {
            height: 0;
            overflow: hidden;
        }
        .video-wrapper audio {
            display: none;
        }

        @media (max-width: 400px) {
            .welcome-char { font-size: 40px; }
            .card { max-width: 340px; padding: 18px 14px 16px; border-radius: 28px; }
            .top-section .left .username { font-size: 17px; }
            .top-section .right .avatar { width: 48px; height: 48px; }
            .col-social { grid-template-columns: 1fr 1fr; }
            .greeting .text { font-size: 13px; animation-duration: 8s; }
            .music-section .controls button { width: 26px; height: 26px; font-size: 12px; }
        }
    </style>
</head>

            <p>Made with <span>🧸</span> by <span>Minh Trí</span></p>

    </div>

    <!-- AUDIO PLAYER (ẩn) -->
    <div class="video-wrapper">
        <audio id="audioPlayer" src="https://files.catbox.moe/4n41hq.mp3" preload="auto" loop></audio>
    </div>

    <script>
        // ===== WELCOME =====
        setTimeout(function() {
            document.getElementById('welcomeOverlay').classList.add('hidden');
        }, 2500);

        // ===== SAKURA NỀN =====
        (function() {
            var container = document.getElementById('sakuraBg');
            var symbols = ['💤', '🧸', '🧸', '💤', '💤', '🧸', '🧸', '💤', '🧸'];
            for (var i = 0; i < 30; i++) {
                var el = document.createElement('div');
                el.className = 'sakura';
                el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (16 + Math.random() * 24) + 'px';
                el.style.animationDuration = (10 + Math.random() * 20) + 's';
                el.style.animationDelay = (Math.random() * 15) + 's';
                el.style.opacity = 0.2 + Math.random() * 0.4;
                container.appendChild(el);
            }
        })();

        // ===== GIỌT NƯỚC NỀN =====
        (function() {
            var container = document.getElementById('dropContainer');
            for (var i = 0; i < 40; i++) {
                var drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.width = (2 + Math.random() * 4) + 'px';
                drop.style.height = (8 + Math.random() * 8) + 'px';
                drop.style.animationDuration = (6 + Math.random() * 10) + 's';
                drop.style.animationDelay = (Math.random() * 15) + 's';
                drop.style.opacity = 0.03 + Math.random() * 0.08;
                container.appendChild(drop);
            }
        })();

        // ===== GIỌT NƯỚC BÁM TRÊN MENU =====
        (function() {
            var container = document.getElementById('cardDrops');
            container.innerHTML = '';

            var dropCount = 12;
            var positions = [];

            for (var i = 0; i < dropCount; i++) {
                positions.push({
                    left: 3 + Math.random() * 94,
                    top: 5 + Math.random() * 85,
                    size: 4 + Math.random() * 5,
                    duration: 3.5 + Math.random() * 3,
                    delay: Math.random() * 8,
                });
            }

            positions.sort(function(a, b) { return a.delay - b.delay; });

            positions.forEach(function(pos) {
                var drop = document.createElement('div');
                drop.className = 'card-drop';
                var size = pos.size;
                drop.style.width = size + 'px';
                drop.style.height = (size * 2.4) + 'px';
                drop.style.left = pos.left + '%';
                drop.style.top = pos.top + '%';
                drop.style.animationDuration = pos.duration + 's';
                drop.style.animationDelay = pos.delay + 's';
                drop.style.opacity = 0;
                drop.style.background = 'rgba(255, 255, 255, ' + (0.03 + Math.random() * 0.03) + ')';
                drop.style.boxShadow = '0 0 6px rgba(255, 255, 255, 0.01), inset 0 -2px 4px rgba(255, 255, 255, 0.02)';
                container.appendChild(drop);
            });

            setTimeout(function() {
                var extraDrops = [
                    { left: 15, size: 4, duration: 5, delay: 2 },
                    { left: 40, size: 3, duration: 6, delay: 4 },
                    { left: 65, size: 5, duration: 4.5, delay: 6 },
                    { left: 85, size: 4, duration: 5.5, delay: 3 },
                ];
                extraDrops.forEach(function(pos) {
                    var drop = document.createElement('div');
                    drop.className = 'card-drop';
                    var size = pos.size || 4;
                    drop.style.width = size + 'px';
                    drop.style.height = (size * 2.4) + 'px';
                    drop.style.left = pos.left + '%';
                    drop.style.top = (5 + Math.random() * 80) + '%';
                    drop.style.animationDuration = pos.duration + 's';
                    drop.style.animationDelay = pos.delay + 's';
                    drop.style.opacity = 0;
                    drop.style.background = 'rgba(255, 255, 255, ' + (0.02 + Math.random() * 0.02) + ')';
                    drop.style.boxShadow = '0 0 6px rgba(255, 255, 255, 0.01), inset 0 -2px 4px rgba(255, 255, 255, 0.02)';
                    container.appendChild(drop);
                });
            }, 100);
        })();

        // ===== HIỆU ỨNG CLICK =====
        (function() {
            var container = document.getElementById('clickEffectContainer');
            var symbols = ['💤', '🧸', '🧸', '💤', '💤', '🧸', '🧸', '💤', '🧸'];

            function createEffect(x, y) {
                var count = 6 + Math.floor(Math.random() * 6);
                for (var i = 0; i < count; i++) {
                    var el = document.createElement('div');
                    el.className = 'click-sakura';
                    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    el.style.left = (x + (Math.random() - 0.5) * 140) + 'px';
                    el.style.top = (y + (Math.random() - 0.5) * 80 - 20) + 'px';
                    el.style.fontSize = (18 + Math.random() * 24) + 'px';
                    el.style.animationDuration = (2 + Math.random() * 1.2) + 's';
                    el.style.animationDelay = (Math.random() * 0.4) + 's';
                    el.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                    container.appendChild(el);
                    setTimeout(function() { if (el.parentNode) el.remove(); }, 3500);
                }
            }

            var card = document.getElementById('card');
            card.addEventListener('click', function(e) {
                var target = e.target;
                if (target.closest('a') || target.closest('.music-section') || target.closest('.progress-bar') ||
                    target.closest('button')) return;
                var rect = card.getBoundingClientRect();
                createEffect(e.clientX - rect.left, e.clientY - rect.top);
            });

            card.addEventListener('touchstart', function(e) {
                var touch = e.touches[0];
                if (!touch) return;
                var target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && (target.closest('a') || target.closest('.music-section') || target.closest(
                        '.progress-bar') || target.closest('button'))) return;
                var rect = card.getBoundingClientRect();
                createEffect(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: true });
        })();

        // ===== AUDIO PLAYER =====
        var player = document.getElementById('audioPlayer');
        var isReady = false;

        player.addEventListener('canplaythrough', function() {
            isReady = true;
            player.play().catch(function(e) { console.log('Autoplay bị chặn:', e); });
            updateProgress();
        });

        player.addEventListener('loadedmetadata', function() {
            isReady = true;
        });

        function updateProgress() {
            if (!player || !player.duration) return;
            var current = player.currentTime;
            var duration = player.duration;
            if (duration > 0) {
                document.getElementById('progressFill').style.width = (current / duration * 100) + '%';
                document.getElementById('musicTime').textContent = formatTime(current) + ' / ' + formatTime(duration);
            }
            requestAnimationFrame(updateProgress);
        }

        function formatTime(s) {
            if (!s || s < 0 || isNaN(s)) return '0:00';
            var m = Math.floor(s / 60);
            var sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function togglePlay() {
            if (!player.src || player.src.indexOf('DÁN_LINK') !== -1) {
                alert('⏳ Chưa có link nhạc! Hãy dán link stream trực tiếp vào thẻ <audio>.');
                return;
            }
            if (player.paused) {
                player.play();
            } else {
                player.play(); // giữ hành vi cũ: click là phát
            }
        }

        function togglePause() {
            if (!player.src) return;
            if (!player.paused) {
                player.pause();
            }
        }

        function seekProgress(e) {
            if (!player || !player.duration) return;
            var rect = e.currentTarget.getBoundingClientRect();
            var x = (e.clientX - rect.left) / rect.width;
            player.currentTime = x * player.duration;
        }

        player.addEventListener('timeupdate', updateProgress);

        console.log('🎵 Bio loaded - Audio player ready');
 </script>
