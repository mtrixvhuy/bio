<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- ===== META ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Welcome | Nguyen Minh Tri</title>

    <!-- ===== STYLES ===== -->
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* === SỬ DỤNG HÌNH ẢNH NỀN === */
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            touch-action: none;
            /* thêm một lớp phủ tối nhẹ để chữ nổi bật hơn trên ảnh */
            background-color: rgba(0, 0, 0, 0.4); /* fallback nếu ảnh không tải */
        }

        /* Nếu muốn có lớp phủ tối riêng biệt, có thể dùng body::before nhưng đơn giản nhất là thêm vào background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35); /* lớp phủ tối để tăng độ tương phản */
            z-index: 0;
            pointer-events: none;
        }

        /* ===== NỀN BÔNG TUYẾT ===== */
        .sakura-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sakura {
            position: absolute;
            top: -30px;
            color: #7ec8e3;
            font-size: 18px;
            opacity: 0.35;
            animation: fall linear infinite;
            text-shadow: 0 0 12px rgba(126, 200, 227, 0.15);
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-30px) rotate(0deg) scale(0.8); opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0.03; }
        }

        /* ===== GIỌT NƯỚC NỀN ===== */
        .drop-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 3px;
            height: 12px;
            background: rgba(126, 200, 227, 0.03);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(0.8px);
            animation: dropFall linear infinite;
            box-shadow: 0 0 8px rgba(126, 200, 227, 0.01);
            transform: rotate(3deg);
            will-change: transform, opacity;
        }
        .drop::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 30%;
            width: 20%;
            height: 25%;
            background: rgba(126, 200, 227, 0.06);
            border-radius: 50%;
            filter: blur(1px);
        }
        @keyframes dropFall {
            0% { transform: translateY(-30px) translateX(0px) scale(0.5) rotate(3deg); opacity: 0.08; }
            10% { opacity: 0.2; }
            70% { opacity: 0.2; }
            100% { transform: translateY(110vh) translateX(var(--drift, 15px)) scale(1.1) rotate(10deg); opacity: 0.01; }
        }

        /* ===== WELCOME OVERLAY ===== */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .welcome-overlay.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        /* lớp phủ tối cho welcome overlay */
        .welcome-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }
        .welcome-wrapper {
            display: flex;
            gap: 6px;
            perspective: 800px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .welcome-char {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(126, 200, 227, 0.3), 0 0 80px rgba(126, 200, 227, 0.15);
            -webkit-text-stroke: 1.5px rgba(126, 200, 227, 0.12);
            opacity: 0;
            transform: translateY(50px) rotateX(30deg) scale(0.6);
            animation: charReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            filter: blur(3px);
            display: inline-block;
        }
        .welcome-char:nth-child(1) { animation-delay: 0.05s; }
        .welcome-char:nth-child(2) { animation-delay: 0.12s; }
        .welcome-char:nth-child(3) { animation-delay: 0.19s; }
        .welcome-char:nth-child(4) { animation-delay: 0.26s; }
        .welcome-char:nth-child(5) { animation-delay: 0.33s; }
        .welcome-char:nth-child(6) { animation-delay: 0.40s; }
        .welcome-char:nth-child(7) { animation-delay: 0.47s; }
        .welcome-char::after {
            content: attr(data-char);
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(25px);
            opacity: 0.3;
            z-index: -1;
            animation: charGlow 2s ease-in-out infinite alternate;
        }
        @keyframes charReveal {
            0% { opacity: 0; transform: translateY(50px) rotateX(30deg) scale(0.6); filter: blur(3px); }
            50% { opacity: 0.9; transform: translateY(-8px) rotateX(-3deg) scale(1.05); filter: blur(0.5px); }
            70% { transform: translateY(4px) rotateX(1deg) scale(0.98); }
            100% { opacity: 1; transform: translateY(0px) rotateX(0deg) scale(1); filter: blur(0px); }
        }
        @keyframes charGlow {
            0% { opacity: 0.15; filter: blur(18px); transform: scale(0.95); }
            100% { opacity: 0.35; filter: blur(30px); transform: scale(1.05); }
        }

        /* ===== CARD CHÍNH ===== */
        .card {
            position: relative;
            z-index: 2;
            max-width: 380px;
            width: 100%;
            background: rgba(10, 14, 30, 0.45); /* nền card tối hơn để nổi trên ảnh */
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 48px;
            padding: 24px 20px 22px;
            border: 1px solid rgba(126, 200, 227, 0.1);
            background-clip: padding-box;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(126, 200, 227, 0.05);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, opacity 1s ease;
            overflow: hidden;
            transform: perspective(1400px) rotateY(0deg) rotateX(1deg);
            will-change: transform;
            opacity: 0;
            animation: cardFadeIn 0.8s ease 2.3s forwards;
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: perspective(1400px) rotateY(0deg) rotateX(1deg) scale(0.95) translateY(30px); }
            100% { opacity: 1; transform: perspective(1400px) rotateY(0deg) rotateX(1deg) scale(1) translateY(0px); }
        }

        /* ===== VIỀN PHÁT SÁNG ===== */
        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5, #e0f0fa, #7ec8e3);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 4s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; opacity: 0.5; }
            50% { background-position: 100% 50%; opacity: 0.9; }
            100% { background-position: 0% 50%; opacity: 0.5; }
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 46px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, rgba(126, 200, 227, 0.05), rgba(168, 216, 240, 0.02), rgba(126, 200, 227, 0.05));
            background-clip: padding-box;
            pointer-events: none;
            animation: innerPulse 4s ease-in-out infinite;
        }

        @keyframes innerPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* ===== GIỌT NƯỚC BÁM TRÊN MENU ===== */
        .card-drops {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            border-radius: 48px;
            overflow: hidden;
        }
        .card-drop {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: rgba(126, 200, 227, 0.06);
            filter: blur(1px);
            box-shadow: 0 0 15px rgba(126, 200, 227, 0.04), inset 0 -2px 6px rgba(126, 200, 227, 0.04);
            animation: dropIdle 4.5s ease-in-out infinite alternate;
            transform-origin: center;
        }
        .card-drop::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 22%;
            background: rgba(126, 200, 227, 0.15);
            border-radius: 50%;
            filter: blur(1px);
        }
        @keyframes dropIdle {
            0% { transform: translateY(0px) scale(1) rotate(0deg); opacity: 0.15; }
            40% { transform: translateY(-4px) scale(1.03) rotate(2deg); opacity: 0.3; }
            70% { transform: translateY(-2px) scale(1.01) rotate(-1deg); opacity: 0.22; }
            100% { transform: translateY(0px) scale(1) rotate(0deg); opacity: 0.15; }
        }

        /* ===== HIỆU ỨNG CLICK ===== */
        .click-effect-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }
        .click-sakura {
            position: absolute;
            font-size: 22px;
            opacity: 0;
            animation: clickSakuraFall 2.2s cubic-bezier(0.22, 0.85, 0.36, 1) forwards;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(126, 200, 227, 0.5);
        }
        @keyframes clickSakuraFall {
            0% { opacity: 0; transform: translateY(-20px) translateX(0px) rotate(0deg) scale(0.5); }
            15% { opacity: 1; transform: translateY(10px) translateX(15px) rotate(20deg) scale(1.1); }
            50% { opacity: 1; transform: translateY(60px) translateX(-10px) rotate(180deg) scale(1); }
            85% { opacity: 0.8; transform: translateY(120px) translateX(20px) rotate(340deg) scale(0.9); }
            100% { opacity: 0; transform: translateY(180px) translateX(5px) rotate(400deg) scale(0.6); }
        }
        .click-sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, #7ec8e3, #a8d8f0);
            box-shadow: 0 0 20px rgba(126, 200, 227, 0.6), 0 0 60px rgba(126, 200, 227, 0.25);
            opacity: 0;
            animation: sparkleBurst 1.2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes sparkleBurst {
            0% { opacity: 0; transform: translate(0, 0) scale(0.2); }
            20% { opacity: 1; transform: translate(var(--sx, 20px), var(--sy, -30px)) scale(1.2); }
            60% { opacity: 0.9; transform: translate(var(--sx, 40px), var(--sy, -60px)) scale(0.8); }
            100% { opacity: 0; transform: translate(var(--sx, 60px), var(--sy, -90px)) scale(0.3); }
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 8px;
            position: relative;
            pointer-events: none;
            width: 100%;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #e6f4fa, #a8d8f0, #b8e2f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(126, 200, 227, 0.4);
            -webkit-text-stroke: 0.5px rgba(126, 200, 227, 0.1);
        }
        .header h1::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 20%;
            width: 60%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(126, 200, 227, 0.6), transparent);
            border-radius: 99px;
            opacity: 0.6;
            animation: borderGlow 3s ease-in-out infinite;
        }
        .header p {
            color: #c0d8e8;
            font-size: 13px;
            margin-top: 2px;
            letter-spacing: 2px;
            font-weight: 300;
            opacity: 0.9;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* ===== DATETIME ===== */
        .datetime {
            text-align: center;
            padding: 8px 14px;
            margin-bottom: 10px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(126, 200, 227, 0.12);
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            pointer-events: none;
            width: 100%;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .datetime:hover {
            border-color: rgba(126, 200, 227, 0.25);
            box-shadow: 0 4px 30px rgba(126, 200, 227, 0.1), 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .datetime .time {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(126, 200, 227, 0.25), 0 0 40px rgba(0,0,0,0.5);
        }
        .datetime .date {
            font-size: 12px;
            color: #c0d8e8;
            margin-top: 2px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        /* ===== MUSIC ===== */
        .music-section {
            text-align: center;
            padding: 6px 0 4px;
            pointer-events: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .song-title {
            font-size: 16px;
            font-weight: 700;
            color: #d0e8f5;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(126, 200, 227, 0.3);
        }

        .artist-name {
            font-size: 13px;
            font-weight: 400;
            color: #dcecf5;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* ===== PROGRESS ===== */
        .progress-bar {
            width: 100%;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.15);
            position: relative;
            cursor: pointer;
            transition: height 0.2s ease;
            pointer-events: auto;
        }
        .progress-bar:hover {
            height: 6px;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #7ec8e3, #c0e8ff);
            box-shadow: 0 0 20px rgba(126, 200, 227, 0.5);
            transition: width 0.1s linear;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #d0e0ea;
            margin-top: 4px;
            letter-spacing: 0.5px;
            pointer-events: none;
            width: 100%;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* ===== CONTROLS ===== */
        .music-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
            pointer-events: auto;
            width: 100%;
        }
        .music-btn {
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(126, 200, 227, 0.25);
            background: rgba(0, 0, 0, 0.4);
            color: #d5ecfc;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            min-width: 80px;
            text-shadow: 0 0 12px rgba(126, 200, 227, 0.3);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }
        .music-btn:hover {
            background: rgba(126, 200, 227, 0.15);
            border-color: rgba(126, 200, 227, 0.5);
            box-shadow: 0 4px 25px rgba(126, 200, 227, 0.2), 0 2px 15px rgba(0, 0, 0, 0.4);
            transform: scale(1.03);
        }
        .music-btn:active {
            transform: scale(0.96);
        }

        /* ===== SOCIAL ===== */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            pointer-events: auto;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(126, 200, 227, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #e0f0fa;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
        }

        .social-item::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            padding: 2px;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5, #e0f0fa, #7ec8e3);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 3s ease-in-out infinite;
            opacity: 0.4;
        }

        .social-item:hover::before {
            opacity: 0.9;
        }

        @keyframes borderGlowSocial {
            0% { background-position: 0% 50%; opacity: 0.4; }
            50% { background-position: 100% 50%; opacity: 0.9; }
            100% { background-position: 0% 50%; opacity: 0.4; }
        }

        .social-item:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(126, 200, 227, 0.15);
            border-color: rgba(126, 200, 227, 0.3);
            box-shadow: 0 6px 25px rgba(126, 200, 227, 0.15), 0 4px 18px rgba(0, 0, 0, 0.4);
        }

        .social-item .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-item .icon svg {
            width: 20px;
            height: 20px;
            fill: #aee0ff;
            filter: drop-shadow(0 0 8px rgba(126, 200, 227, 0.4));
            transition: fill 0.3s ease, transform 0.3s ease, filter 0.3s ease;
        }

        .social-item:hover .icon svg {
            fill: #ffffff;
            transform: scale(1.1);
            filter: drop-shadow(0 0 18px rgba(126, 200, 227, 0.8));
        }

        .social-item .text {
            flex: 1;
            font-size: 12px;
            text-shadow: 0 0 8px rgba(0,0,0,0.7);
        }

        .social-item .arrow {
            color: #c0d8e8;
            font-size: 13px;
            transition: transform 0.2s ease, color 0.2s ease;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        .social-item:hover .arrow {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(126, 200, 227, 0.1);
            position: relative;
            pointer-events: none;
            width: 100%;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(126, 200, 227, 0.2), transparent);
            border-radius: 99px;
            opacity: 0.6;
            animation: borderGlow 3s ease-in-out infinite;
        }
        .footer p {
            font-size: 10px;
            color: #d0e0ea;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .footer span {
            color: #aee0ff;
            text-shadow: 0 0 10px rgba(126, 200, 227, 0.4);
        }

        /* ===== YOUTUBE PLAYER ẨN ===== */
        .video-wrapper {
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .welcome-char {
                font-size: 42px;
            }
            .welcome-wrapper {
                gap: 4px;
            }
            .card {
                padding: 18px 14px 16px;
                border-radius: 32px;
                max-width: 320px;
                background: rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(20px) saturate(1.2);
                -webkit-backdrop-filter: blur(20px) saturate(1.2);
                transform: perspective(1000px) rotateY(0deg) rotateX(1deg);
            }
            .card::before { border-radius: 34px; }
            .card::after { border-radius: 30px; }
            .card-drops { border-radius: 32px; }

<!-- ===== JAVASCRIPT ===== -->
<script>
    // ================================================================
    // 1. WELCOME OVERLAY - TỰ ĐỘNG ẨN SAU 2.8s
    // ================================================================
    setTimeout(() => {
        document.getElementById('welcomeOverlay').classList.add('hidden');
    }, 2800);

    // ================================================================
    // 2. HIỆU ỨNG CLICK - BÔNG TUYẾT + KIM TUYẾN
    // ================================================================
    (function() {
        const container = document.getElementById('clickEffectContainer');
        const sakuraSymbols = ['❄', '❄', '❄', '❄', '❄', '❄'];
        const sparkleColors = ['#ffffff', '#7ec8e3', '#a8d8f0', '#b8e2f5', '#e0f0fa'];

        function createEffect(x, y) {
            // Bông tuyết rơi
            const count = 5 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'click-sakura';
                el.textContent = sakuraSymbols[Math.floor(Math.random() * sakuraSymbols.length)];
                el.style.left = (x + (Math.random() - 0.5) * 120) + 'px';
                el.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
                el.style.fontSize = (16 + Math.random() * 22) + 'px';
                el.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
                el.style.animationDelay = (Math.random() * 0.3) + 's';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                el.style.color = '#aee0ff';
                container.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.remove(); }, 3500);
            }

            // Kim tuyến lấp lánh
            const sparkleCount = 10 + Math.floor(Math.random() * 8);
            for (let i = 0; i < sparkleCount; i++) {
                const el = document.createElement('div');
                el.className = 'click-sparkle';
                const angle = Math.random() * 2 * Math.PI;
                const distance = 30 + Math.random() * 70;
                const sx = Math.cos(angle) * distance;
                const sy = Math.sin(angle) * distance - 30;
                el.style.left = (x + (Math.random() - 0.5) * 20) + 'px';
                el.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
                el.style.setProperty('--sx', sx + 'px');
                el.style.setProperty('--sy', sy + 'px');
                el.style.width = (3 + Math.random() * 6) + 'px';
                el.style.height = (3 + Math.random() * 6) + 'px';
                el.style.background = `radial-gradient(circle, ${sparkleColors[Math.floor(Math.random() * sparkleColors.length)]}, #ffffff)`;
                el.style.boxShadow = `0 0 ${10 + Math.random() * 20}px ${sparkleColors[Math.floor(Math.random() * sparkleColors.length)]}`;
                el.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                el.style.animationDelay = (Math.random() * 0.2) + 's';
                container.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.remove(); }, 2000);
            }
        }

        const card = document.getElementById('card');
        card.addEventListener('click', function(e) {
            const target = e.target;
            if (target.closest('.music-btn') || target.closest('a') || target.closest('.progress-bar')) {
                return;
            }
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createEffect(x, y);
        });

        card.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            if (!touch) return;
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && (target.closest('.music-btn') || target.closest('a') || target.closest('.progress-bar'))) {
                return;
            }
            const rect = card.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            createEffect(x, y);
        }, { passive: true });
    })();

    // ================================================================
    // 3. NỀN BÔNG TUYẾT
    // ================================================================
    (function() {
        const c = document.getElementById('sakuraContainer');
        const p = ['❄', '❄', '❄', '❄', '❄', '❄'];
        for (let i = 0; i < 35; i++) {
            const e = document.createElement('div');
            e.className = 'sakura';
            e.textContent = p[Math.floor(Math.random() * p.length)];
            e.style.left = Math.random() * 100 + '%';
            e.style.fontSize = (14 + Math.random() * 22) + 'px';
            e.style.animationDuration = (8 + Math.random() * 16) + 's';
            e.style.animationDelay = (Math.random() * 15) + 's';
            e.style.opacity = 0.3 + Math.random() * 0.5;
            c.appendChild(e);
        }
    })();

    // ================================================================
    // 4. GIỌT NƯỚC NỀN
    // ================================================================
    (function() {
        const container = document.getElementById('dropContainer');
        for (let i = 0; i < 40; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            const x = Math.random() * 100;
            const delay = Math.random() * 18;
            const duration = 10 + Math.random() * 18;
            const size = 3 + Math.random() * 7;
            const drift = (Math.random() - 0.5) * 50;
            drop.style.left = x + '%';
            drop.style.width = size + 'px';
            drop.style.height = (size * 2.8) + 'px';
            drop.style.animationDuration = duration + 's';
            drop.style.animationDelay = delay + 's';
            drop.style.setProperty('--drift', drift + 'px');
            drop.style.opacity = 0.08 + Math.random() * 0.2;
            drop.style.background = `rgba(126, 200, 227, ${0.04 + Math.random() * 0.06})`;
            container.appendChild(drop);
        }
    })();

    // ================================================================
    // 5. GIỌT NƯỚC BÁM TRÊN MENU
    // ================================================================
    (function() {
        const container = document.getElementById('cardDrops');
        const positions = [
            { top: '3%', left: '4%', size: 12 },
            { top: '6%', right: '6%', size: 9 },
            { top: '15%', left: '16%', size: 7 },
            { top: '24%', right: '14%', size: 10 },
            { top: '36%', left: '3%', size: 8 },
            { top: '42%', right: '4%', size: 10 },
            { top: '53%', left: '12%', size: 6 },
            { top: '60%', right: '9%', size: 9 },
            { top: '73%', left: '6%', size: 7 },
            { top: '80%', right: '6%', size: 5 },
            { top: '10%', left: '40%', size: 5 },
            { top: '28%', left: '50%', size: 4 },
            { top: '48%', left: '58%', size: 6 },
            { top: '66%', left: '46%', size: 4 },
            { top: '86%', left: '36%', size: 5 },
        ];

        positions.forEach((pos) => {
            const drop = document.createElement('div');
            drop.className = 'card-drop';
            const size = pos.size || 8;
            drop.style.width = size + 'px';
            drop.style.height = (size * 2.6) + 'px';
            drop.style.top = pos.top;
            if (pos.left) drop.style.left = pos.left;
            if (pos.right) drop.style.right = pos.right;
            drop.style.animationDuration = (3.5 + Math.random() * 3.5) + 's';
            drop.style.animationDelay = (Math.random() * 3) + 's';
            drop.style.opacity = 0.1 + Math.random() * 0.2;
            drop.style.background = `rgba(126, 200, 227, ${0.05 + Math.random() * 0.07})`;
            container.appendChild(drop);
        });
    })();

    // ================================================================
    // 6. ĐỒNG HỒ THỜI GIAN THỰC
    // ================================================================
    (function() {
        const timeEl = document.getElementById('timeDisplay');
        const dateEl = document.getElementById('dateDisplay');
        const DAYS = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        function update() {
            const n = new Date();
            timeEl.textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
            dateEl.textContent = `${DAYS[n.getDay()]}, ${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;
        }
        update();
        setInterval(update, 1000);
    })();

    // ================================================================
    // 7. GYROSCOPE - NGHIÊNG THEO ĐIỆN THOẠI
    // ================================================================
    (function() {
        const card = document.getElementById('card');
        let targetRotateY = 0;
        let isGyroActive = false;

        function updateCard() {
            if (!card) return;
            const rotY = Math.max(-12, Math.min(12, targetRotateY));
            const rotX = 1.5 + (targetRotateY * 0.08);
            card.style.transform = `perspective(1400px) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            isGyroActive = true;
                        }
                    })
                    .catch(() => {});
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                isGyroActive = true;
            }
        }

        function handleOrientation(event) {
            const gamma = event.gamma || 0;
            targetRotateY = Math.max(-12, Math.min(12, (gamma / 45) * 12));
            updateCard();
        }

        // Fallback: kéo chuột/touch khi không có gyroscope
        let isDragging = false;
        let startX = 0;
        let dragRotate = 0;

        if (!isGyroActive) {
            card.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                dragRotate = targetRotateY;
                card.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const diff = (e.clientX - startX) / 8;
                targetRotateY = Math.max(-12, Math.min(12, dragRotate + diff));
                updateCard();
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                card.style.cursor = 'default';
            });

            let touchStartX = 0;
            let touchRotate = 0;
            card.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if (touch) {
                    touchStartX = touch.clientX;
                    touchRotate = targetRotateY;
                }
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                if (!touch) return;
                const diff = (touch.clientX - touchStartX) / 8;
                targetRotateY = Math.max(-12, Math.min(12, touchRotate + diff));
                updateCard();
            }, { passive: true });

            // Tự động lắc nhẹ
            let autoTimer = null;
            let autoPos = 0;
            let autoDir = 1;
            setTimeout(() => {
                autoTimer = setInterval(() => {
                    if (isDragging) return;
                    autoPos += autoDir * 0.08;
                    if (autoPos > 4 || autoPos < -4) autoDir *= -1;
                    targetRotateY = autoPos;
                    updateCard();
                }, 50);
            }, 4000);
        }
    })();

    // ================================================================
    // 8. YOUTUBE PLAYER - TỰ ĐỘNG PHÁT KHI VÀO TRANG
    // ================================================================
    (function() {
        let player = null, isReady = false, attempts = 0;
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');

        function fmt(s) {
            if (!s || s < 0) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function updateProgress() {
            if (!player || !player.getCurrentTime) return;
            const c = player.getCurrentTime();
            const d = player.getDuration();
            if (d > 0) {
                progressFill.style.width = (c / d * 100) + '%';
                currentTimeEl.textContent = fmt(c);
                totalTimeEl.textContent = fmt(d);
            }
        }

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtubePlayer', {
                events: {
                    onReady: function(e) {
                        isReady = true;
                        totalTimeEl.textContent = fmt(player.getDuration());
                        setInterval(updateProgress, 500);
                        // === TỰ ĐỘNG PHÁT NHẠC KHI VÀO WEB ===
                        player.playVideo();
                    },
                    onStateChange: function(e) {
                        const s = e.data;
                        if (s === YT.PlayerState.PLAYING) {
                            playBtn.textContent = '▶ Tiếp tục';
                        } else if (s === YT.PlayerState.PAUSED) {
                            playBtn.textContent = '▶ Phát';
                        } else if (s === YT.PlayerState.ENDED) {
                            playBtn.textContent = '▶ Phát lại';
                        }
                    },
                    onError: function() {
                        if (attempts < 5) {
                            attempts++;
                            setTimeout(() => {
                                if (player && isReady) player.playVideo();
                            }, 2000);
                        }
                    }
                }
            });
        };

        // Click trên thanh progress để tua
        progressBar.addEventListener('click', function(e) {
            if (!player || !player.getDuration) return;
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            player.seekTo(x * player.getDuration(), true);
        });

        // Nút phát
        playBtn.addEventListener('click', function() {
            if (!isReady) {
                alert('⏳ Đang tải nhạc, vui lòng chờ...');
                return;
            }
            const s = player.getPlayerState();
            if (s === YT.PlayerState.PAUSED || s === YT.PlayerState.ENDED || s === -1) {
                player.playVideo();
            } else if (s !== YT.PlayerState.PLAYING) {
                player.playVideo();
            }
        });

        // Nút tạm dừng
        pauseBtn.addEventListener('click', function() {
            if (!isReady) {
                alert('⏳ Đang tải nhạc, vui lòng chờ...');
                return;
            }
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            }
        });

        // Tải YouTube IFrame API
        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(script);

        // Fallback: thử phát lại sau 3s nếu chưa sẵn sàng
        setTimeout(() => {
            if (isReady) {
                try { player.playVideo(); } catch (_) {}
            }
        }, 3000);
    })();
</script>
