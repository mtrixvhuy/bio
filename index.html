<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- ===== META ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Welcome | MTri</title>

    <!-- ===== STYLES ===== -->
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
background: https://nld.mediacdn.vn/291774122806476800/2024/6/13/hien-tuong-nay-bao-hieu-diem-khong-lanh-cho-cac-loai-sinh-vat-bien-1718255037113783508909.jpg no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            touch-action: none;
        }

        /* ===== NỀN BÔNG TUYẾT ===== */
        .sakura-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sakura {
            position: absolute;
            top: -30px;
            color: #7ec8e3;
            font-size: 18px;
            opacity: 0.35;
            animation: fall linear infinite;
            text-shadow: 0 0 12px rgba(126, 200, 227, 0.15);
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-30px) rotate(0deg) scale(0.8); opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0.03; }
        }

        /* ===== GIỌT NƯỚC NỀN ===== */
        .drop-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 3px;
            height: 12px;
            background: rgba(126, 200, 227, 0.03);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(0.8px);
            animation: dropFall linear infinite;
            box-shadow: 0 0 8px rgba(126, 200, 227, 0.01);
            transform: rotate(3deg);
            will-change: transform, opacity;
        }
        .drop::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 30%;
            width: 20%;
            height: 25%;
            background: rgba(126, 200, 227, 0.06);
            border-radius: 50%;
            filter: blur(1px);
        }
        @keyframes dropFall {
            0% { transform: translateY(-30px) translateX(0px) scale(0.5) rotate(3deg); opacity: 0.08; }
            10% { opacity: 0.2; }
            70% { opacity: 0.2; }
            100% { transform: translateY(110vh) translateX(var(--drift, 15px)) scale(1.1) rotate(10deg); opacity: 0.01; }
        }

        /* ===== WELCOME OVERLAY ===== */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 50%, #0a0e1a, #050a12);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .welcome-overlay.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .welcome-wrapper {
            display: flex;
            gap: 6px;
            perspective: 800px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .welcome-char {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(126, 200, 227, 0.3), 0 0 80px rgba(126, 200, 227, 0.15);
            -webkit-text-stroke: 1.5px rgba(126, 200, 227, 0.12);
            opacity: 0;
            transform: translateY(50px) rotateX(30deg) scale(0.6);
            animation: charReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            filter: blur(3px);
            display: inline-block;
        }
        .welcome-char:nth-child(1) { animation-delay: 0.05s; }
        .welcome-char:nth-child(2) { animation-delay: 0.12s; }
        .welcome-char:nth-child(3) { animation-delay: 0.19s; }
        .welcome-char:nth-child(4) { animation-delay: 0.26s; }
        .welcome-char:nth-child(5) { animation-delay: 0.33s; }
        .welcome-char:nth-child(6) { animation-delay: 0.40s; }
        .welcome-char:nth-child(7) { animation-delay: 0.47s; }
        .welcome-char::after {
            content: attr(data-char);
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(25px);
            opacity: 0.3;
            z-index: -1;
            animation: charGlow 2s ease-in-out infinite alternate;
        }
        @keyframes charReveal {
            0% { opacity: 0; transform: translateY(50px) rotateX(30deg) scale(0.6); filter: blur(3px); }
            50% { opacity: 0.9; transform: translateY(-8px) rotateX(-3deg) scale(1.05); filter: blur(0.5px); }
            70% { transform: translateY(4px) rotateX(1deg) scale(0.98); }
            100% { opacity: 1; transform: translateY(0px) rotateX(0deg) scale(1); filter: blur(0px); }
        }
        @keyframes charGlow {
            0% { opacity: 0.15; filter: blur(18px); transform: scale(0.95); }
            100% { opacity: 0.35; filter: blur(30px); transform: scale(1.05); }
        }

        /* ===== CARD CHÍNH ===== */
        .card {
            position: relative;
            z-index: 2;
            max-width: 380px;
            width: 100%;
            background: rgba(10, 14, 30, 0.28);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 48px;
            padding: 24px 20px 22px;
            border: 1px solid rgba(126, 200, 227, 0.06);
            background-clip: padding-box;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 15px 40px rgba(0, 0, 0, 0.3), 0 0 60px rgba(126, 200, 227, 0.04);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, opacity 1s ease;
            overflow: hidden;
            transform: perspective(1400px) rotateY(0deg) rotateX(1deg);
            will-change: transform;
            opacity: 0;
            animation: cardFadeIn 0.8s ease 2.3s forwards;
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: perspective(1400px) rotateY(0deg) rotateX(1deg) scale(0.95) translateY(30px); }
            100% { opacity: 1; transform: perspective(1400px) rotateY(0deg) rotateX(1deg) scale(1) translateY(0px); }
        }

        /* ===== VIỀN PHÁT SÁNG ===== */
        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50px;
            padding: 2px;
            background: linear-gradient(135deg, #7ec8e3, #a8d8f0, #b8e2f5, #e0f0fa, #7ec8e3);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 4s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
